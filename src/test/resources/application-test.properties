# Default profile used by Spring Boot tests in src/test/java.
# Integration tests under src/integrationTest/java override Mongo + S3
# endpoints via @DynamicPropertySource so values here are placeholders only.

spring.application.name=modl-backend-test
spring.web.error.whitelabel.enabled=false
server.shutdown=immediate

# Mongo placeholders. Override per-test with Testcontainers @DynamicPropertySource.
spring.data.mongodb.uri=mongodb://localhost:27017/modl-test
spring.data.mongodb.auto-index-creation=false
spring.data.mongodb.uuid-representation=standard
# Main application.properties carries a non-standard `spring.mongodb.uri=${MONGODB_URI}` —
# override the literal here so placeholder resolution does not require the env var.
spring.mongodb.uri=mongodb://localhost:27017/modl-test

# Mail — disabled in tests.
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

# Spring Security basic auth defaults (tests should not rely on these).
spring.security.user.name=test-admin
spring.security.user.password=test-admin

# Domain / CORS.
modl.domain=modl.test
modl.app-domain=modl.test
modl.cors.system-origins=https://modl.test
modl.cors.app-domains=modl.test
modl.cors.replay-lite-origins=https://replays.modl.test

# Email.
modl.email.from-name=modl.test
modl.email.from-email-address=noreply@modl.test
modl.auth.email-code-expiry=60
modl.auth.code-hash-secret=test-auth-code-hash-secret
modl.auth.session-duration-seconds=1209600
modl.ticket.email-verification.code-expiry-seconds=60
modl.ticket.email-verification.token-expiry-seconds=60
modl.ticket.email-verification.code-hash-secret=test-auth-code-hash-secret

# Cleanup jobs disabled by default so @Scheduled noise stays out of tests.
modl.registration.cleanup.enabled=false
modl.registration.cleanup.dry-run=true
modl.registration.cleanup.expiry=24h
modl.registration.cleanup.interval-ms=3600000
modl.registration.cleanup.batch-size=100
modl.registration.cleanup.claim-ttl=6h

# Realtime WebSocket — disabled in tests; integration tests override as needed.
modl.realtime.ws.enabled=false
modl.realtime.ws.public-url=
modl.realtime.ws.protocol-version=1
modl.realtime.ws.heartbeat-timeout-seconds=60
modl.realtime.ws.handshake-timeout-seconds=10
modl.realtime.ws.heartbeat-sweep-interval-ms=15000
modl.realtime.ws.inbound-rate-limit-messages=120
modl.realtime.ws.inbound-rate-limit-window-seconds=10
modl.realtime.ws.deploy-drain-close-code=1012
modl.realtime.ws.deploy-drain-retry-after-ms=5000
modl.realtime.ws.max-frame-bytes=65536
modl.realtime.ws.send-time-limit-ms=10000
modl.realtime.ws.send-buffer-size-bytes=262144
modl.realtime.ws.idle-timeout-ms=75000
modl.realtime.ws.max-text-frame-bytes=1024
modl.realtime.ws.async-send-timeout-ms=10000

# LLM / Gemini — unused in tests, placeholders so context loads.
modl.llm.gemini-model-id=gemini-test
modl.llm.gemini-api-key=test-gemini-key
modl.llm.gemini-temperature=0.0
modl.llm.gemini-max-output-tokens=1024
modl.llm.gemini-top-p=0.1

# Storage placeholders. Integration tests with LocalStack override endpoint + creds.
modl.storage.key-id=test-key-id
modl.storage.application-key=test-application-key
modl.storage.bucket-name=test-tenant-bucket
modl.storage.endpoint=http://localhost:4566
modl.storage.cdn-domain=cdn.modl.test
modl.replay-lite.storage.key-id=test-key-id
modl.replay-lite.storage.application-key=test-application-key
modl.replay-lite.storage.bucket-name=test-replay-lite-bucket
modl.replay-lite.storage.endpoint=http://localhost:4566
modl.replay-lite.storage.cdn-domain=replays.modl.test

# Cloudflare — unused in tests.
modl.cloudflare.api-token=
modl.cloudflare.zone-id=
modl.turnstile.secret-key=

# Stripe placeholders. Integration tests override the webhook secret with a known
# value so HMAC signatures can be computed deterministically.
modl.stripe.secret-key=sk_test_placeholder
modl.stripe.webhook-secret=whsec_test_placeholder
modl.stripe.price-id=price_test_placeholder

# File upload.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Actuator — disabled for tests.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=false
management.prometheus.metrics.export.enabled=false

logging.level.org.apache.coyote.http11.Http11Processor=OFF
spring.threads.virtual.enabled=true
server.tomcat.accept-count=10
server.tomcat.connection-timeout=10s
